name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Gate (format, lint, types, tests + coverage)
        run: make check
      - name: Offline demo
        run: make demo
